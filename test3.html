<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 測試網頁</title>
    <!-- 引入 Supabase 官方 CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        button { padding: 5px 10px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>

    <h2>Supabase 讀寫測試</h2>

    <!-- 寫入資料區塊 -->
    <div class="box">
        <h3>1. 寫入資料 (Insert)</h3>
        <label>欄位名稱 (例如 name): </label>
        <input type="text" id="inputValue" placeholder="請輸入要測試的文字">
        <button onclick="writeData()">寫入資料</button>
        <p id="writeStatus"></p>
    </div>

    <!-- 讀取資料區塊 -->
    <div class="box">
        <h3>2. 讀取資料 (Select)</h3>
        <button onclick="readData()">從資料庫讀取最新資料</button>
        <pre id="output">資料將顯示在此處...</pre>
    </div>

    <script>
        // 1. 初始化 Supabase 客戶端 (請替換成您的設定)
        const SUPABASE_URL = 'https://tukzmdtkhdxdpbnvkjzz.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1a3ptZHRraGR4ZHBibnZranp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzcyMDQsImV4cCI6MjA5NDkxMzIwNH0.g-wtAQ259b8h9qdiQTUF6Vuoxjm5K1MPJLqkZmFfBjA';
        const TABLE_NAME = '顧客留言'; // 例如 'todos' 或 'users'

        const supabase = @supabase/supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. 寫入資料功能
        async function writeData() {
            const value = document.getElementById('inputValue').value;
            const statusEl = document.getElementById('writeStatus');
            
            if (!value) {
                statusEl.innerText = '請輸入內容！';
                return;
            }

            statusEl.innerText = '寫入中...';

            // ⚠️ 請根據您 Table 的實際欄位名稱修改 { name: value }
            const { data, error } = await supabase
                .from(顧客留言)
                .insert([{ name: value }]); 

            if (error) {
                statusEl.innerText = '錯誤: ' + error.message;
                console.error(error);
            } else {
                statusEl.innerText = '🎉 資料寫入成功！';
                document.getElementById('inputValue').value = '';
                readData(); // 寫入成功後自動重新整理列表
            }
        }

        // 3. 讀取資料功能
        async function readData() {
            const outputEl = document.getElementById('output');
            outputEl.innerText = '讀取中...';

            const { data, error } = await supabase
                .from(顧客留言)
                .select('*')
                .limit(10); // 預設只撈取前 10 筆

            if (error) {
                outputEl.innerText = '錯誤: ' + error.message;
                console.error(error);
            } else {
                outputEl.innerText = JSON.stringify(data, null, 2);
            }
        }
    </script>
</body>
</html>
