  <style>
    /* 星露谷物語風格變數 */
    :root {
      --sd-grass: #88c24c;          /* 草地綠背景 */
      --sd-grass-dark: #6fa03d;     /* 草地陰影 */
      --sd-wood: #c06c28;           /* 木頭亮面 */
      --sd-wood-dark: #82380d;      /* 木頭邊框/暗面 */
      --sd-parchment: #fdeca6;      /* 羊皮紙底色 (對話框) */
      --sd-parchment-dark: #dcb360; /* 羊皮紙邊緣 */

    * { box-sizing: border-box; }
    
    body {

      background-color: var(--sd-grass);

      background-size: 40px 40px;
      color: var(--sd-text); 
      margin: 0; 
      padding: 0;

    /* 木製招牌頂部導航 */

      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: #a3aeb1;

    .header::before { left: 20px; }
    .header::after { right: 20px; }

    .header h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 2px;}
    .container { max-width: 1200px; margin: 0 auto; padding: 25px 20px; }

    /* 共用 UI 對話框風格 */

    /* 位置設定區 */

      flex-wrap: wrap;

      align-items: center;

    .select-group { display: flex; gap: 10px; flex-grow: 1; min-width: 280px;}
    .select-group select { 
      flex: 1; 
      padding: 12px 15px; 
      border: 3px solid var(--sd-wood-dark); 
      border-radius: 6px; 
      outline: none; 
      font-size: 16px; 
      font-weight: bold;
      color: var(--sd-text);

      background-repeat: no-repeat; 
      background-position: right 10px top 50%;

      box-shadow: inset 2px 2px 0 rgba(0,0,0,0.05);
    }
    .select-group select:focus { border-color: var(--sd-border); background: #fff;}

    .btn-search {

      color: white; 
      border: 3px solid var(--sd-border); 
      padding: 12px 30px; 
      border-radius: 6px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.1s; 
      white-space: nowrap;

    .btn-search:hover { background: #d37d36; }
    .btn-search:active { box-shadow: inset 2px 4px 0px rgba(0,0,0,0.2); transform: translateY(4px); }

    /* 溫馨提示文字 */
    .notice-text {

      text-align: right;
      font-size: 15px;
      color: var(--sd-text-muted);
      font-weight: bold;
      margin-top: -5px;
    }

    .quick-search-box { display: none; margin-bottom: 25px; width: 100%; position: relative;}
    .quick-search-box input { 
      width: 100%; 
      padding: 14px 20px 14px 45px; 
      border: 4px solid var(--sd-border); 
      background: var(--sd-parchment);

      font-size: 16px; 
      font-weight: bold;
      color: var(--sd-text);

    .quick-search-box input:focus { background: #fff8d6; }
    .quick-search-box::before { content: '🔎'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; z-index: 2;}

    /* 商品網格與卡片 */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .p-card { 
      display: flex; 
      flex-direction: column; 
      position: relative;
      transition: transform 0.2s;
    }
    .p-card:hover { transform: translateY(-6px); }
    
    .hot-badge { 
      position: absolute; 
      top: -10px; 
      left: -10px; 
      background: var(--sd-hot); 
      color: white; 
      padding: 6px 15px; 
      font-size: 13px; 
      font-weight: bold; 
      border: 3px solid var(--sd-border);
      border-radius: 4px; 
      box-shadow: 2px 4px 0px rgba(0,0,0,0.2);

      text-shadow: 1px 1px 0px var(--sd-border);
    }

    /* ★ 圖片點擊放大特效 */
    .p-img-box { 
      width: 100%; 
      height: 200px; 
      background: #fff; 
      border-bottom: 4px solid var(--sd-border);

      cursor: pointer; /* 滑鼠變成手指 */
    }
    .p-img-box img { width: 100%; height: 100%; object-fit: contain; }
    
    /* 懸浮時的黑霧與提示文字 */
    .p-img-box::after {
      content: '🔍 點擊放大';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none; /* ★ 修正 1：加上讓滑鼠點擊「穿透」黑霧的屬性 */
    }
    .p-img-box:hover::after {
      opacity: 1;
    }
    
    .p-info { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .p-title { font-size: 19px; font-weight: bold; margin: 0 0 10px 0; color: var(--sd-text); line-height: 1.4; text-shadow: 1px 1px 0px rgba(255,255,255,0.6);}
    .p-desc { font-size: 15px; color: var(--sd-text-muted); margin-bottom: 16px; line-height: 1.6; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: bold;}
    
    .p-meta { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 2px dashed var(--sd-wood-dark); }
    .p-barcode { font-family: 'VT323', monospace; font-size: 16px; color: #fff; background: var(--sd-wood-dark); padding: 4px 8px; border-radius: 4px; border: 2px solid var(--sd-border); letter-spacing: 1px;}
    .p-price { font-family: 'VT323', monospace; font-size: 28px; font-weight: normal; color: var(--sd-hot); text-shadow: 1px 1px 0px rgba(255,255,255,0.8); letter-spacing: 1px;}
    .p-price::before { content: '💰 '; font-size: 18px; font-family: 'Noto Sans TC', sans-serif; }

    .btn-view-branch { 
      width: calc(100% - 32px); 
      margin: 0 16px 16px 16px; 
      background: var(--sd-wood); 
      color: white; 
      border: 3px solid var(--sd-border); 
      padding: 12px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      border-radius: 6px; 
      transition: transform 0.1s; 
      box-shadow: inset -2px -4px 0px rgba(0,0,0,0.2); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 6px; 
      text-shadow: 1px 1px 0px var(--sd-border);
    }
    .btn-view-branch:hover { background: #d37d36; }
    .btn-view-branch:active { box-shadow: inset 2px 4px 0px rgba(0,0,0,0.2); transform: translateY(2px); }
    
    .initial-state { text-align: center; padding: 60px 20px; color: var(--sd-text); grid-column: 1 / -1; background: var(--sd-parchment); border: 4px dashed var(--sd-wood-dark); border-radius: 12px;}
    .initial-state h2 { color: var(--sd-wood-dark); margin-bottom: 15px; font-size: 24px;}
    .initial-state p { font-size: 18px; line-height: 1.6; font-weight: bold;}

    /* 分局彈出視窗 (Modal) */
    .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); justify-content: center; align-items: center; }
    .modal-content { 
      width: 90%; 
      max-width: 500px; 
      max-height: 85vh; 
      display: flex; 
      flex-direction: column; 
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .modal-header { 
      background: var(--sd-wood); 
      color: white; 
      padding: 16px 20px; 
      font-weight: bold; 
      font-size: 18px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;

    }
    .btn-close {

      border: 3px solid var(--sd-border); 
      color: white; 
      font-size: 20px; 
      font-weight: bold;
      width: 36px;
      height: 36px;

    }
    .btn-close:active { box-shadow: inset 2px 2px 0px rgba(0,0,0,0.3); transform: translateY(2px);}
    
    .modal-body { padding: 0; overflow-y: auto; background: var(--sd-parchment); flex-grow: 1; border-radius: 0 0 4px 4px;}
    
    .branch-list { list-style: none; padding: 0; margin: 0; }
    .branch-item { padding: 20px; border-bottom: 2px dotted var(--sd-wood-dark); transition: background 0.2s; border-left: 6px solid transparent; }
    .branch-item:last-child { border-bottom: none; }
    .branch-item:hover { background: rgba(255, 255, 255, 0.4); }
    
    .branch-item.highlight { 
      background-color: rgba(255, 215, 0, 0.2); 
      border-left: 6px solid #eab308; 
    }

    .b-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px;}
    .b-name-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1;}
    .b-name { font-weight: bold; color: var(--sd-text); font-size: 18px; text-shadow: 1px 1px 0px #fff;}

    .b-qty { 
      background: var(--sd-grass-dark);

      padding: 4px 10px;

      border-radius: 4px;

    .b-detail { font-size: 16px; font-weight: bold; color: var(--sd-text-muted); display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; line-height: 1.4;}

    /* ★ 圖片畫廊 (Lightbox) 樣式 */
    #galleryLightbox {
      display: none; position: fixed; z-index: 10005; inset: 0;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);

    .gallery-container {

    .gallery-img {

    .gallery-title {

      text-shadow: 2px 2px 4px black; text-align: center;

    /* ★ 修正 2：補回燈箱說明的 CSS 樣式 */
    .gallery-desc {
      color: #e2e8f0; margin-top: 8px; font-size: 14px; font-weight: normal; 
      text-shadow: 1px 1px 3px black; text-align: center; max-width: 90vw;

    .footer {

    function fetchAndRenderProducts() {
      const city = document.getElementById('citySelect').value;
      if (!city) return alert("請先選擇您所在的縣市，以利為您推薦最近的郵局！");

      document.getElementById('loader').style.display = 'flex';
      
      fetch(GAS_API_URL + '?action=getCustomerData')
        .then(response => response.json())
        .then(res => {
          document.getElementById('loader').style.display = 'none';
          if(res.status === 'success') {
            globalData = res;
            document.getElementById('quickSearchBox').style.display = 'block';
            document.getElementById('localSearchInput').value = ''; 
            
            renderProducts(globalData.products);
          } else {
            alert('資料載入失敗：' + res.message);
          }
        })
        .catch(err => {
          document.getElementById('loader').style.display = 'none';
          alert('網路連線發生錯誤，請確認 GAS API 網址是否正確且已發布！\n' + err);
        });
    }

    function getTop5Branches(productKey) {
      const selCity = document.getElementById('citySelect').value;
      const selDist = document.getElementById('districtSelect').value;
      
      const stockList = globalData.stockMap[productKey] || [];
      if (stockList.length === 0) return []; 

      let branchPool = stockList.map(stock => {
        const info = globalData.branchInfo[stock.branchId];
        if (!info) return null;
        
        let priority = 3; 
        if (selCity && info.address.includes(selCity)) {
          priority = 2; 
          if (selDist && info.address.includes(selDist)) {
            priority = 1; 
          }
        }
        
        return {
          name: info.name,
          address: info.address,
          phone: info.phone,
          qty: stock.qty,
          priority: priority,
          activeScore: info.baseActiveScore || 0 
        };
      }).filter(b => b !== null);

      branchPool.sort((a, b) => {
        if (a.priority !== b.priority) return a.priority - b.priority;

        const aStockBonus = a.qty > 5 ? 10 : 0;
        const bStockBonus = b.qty > 5 ? 10 : 0;
        const aTotalScore = a.activeScore + aStockBonus;
        const bTotalScore = b.activeScore + bStockBonus;

        if (aTotalScore !== bTotalScore) return bTotalScore - aTotalScore; 

        return b.qty - a.qty;
      });

      return branchPool.slice(0, 5);
    }

    function renderProducts(filteredList) {
      const container = document.getElementById('productContainer');
      
      if (!filteredList || filteredList.length === 0) {
        container.innerHTML = '<div class="initial-state"><h2>找不到符合的商品 🍂</h2><p>請嘗試更換搜尋關鍵字，或郵局目前暫未提供該商品。</p></div>';
        return;
      }

      container.innerHTML = '';
      let topBadgeCount = 0;
      
      filteredList.forEach((p) => {
        const hasStock = (globalData.stockMap[p.key] || []).length > 0;
        
        let badgeHtml = '';
        if (hasStock && p.clicks > 0 && topBadgeCount < 3) {
          topBadgeCount++;
          badgeHtml = `<div class="hot-badge">⭐ 人氣商品 TOP ${topBadgeCount}</div>`;
        }

        const outOfStockStyle = hasStock ? '' : 'opacity: 0.75; filter: grayscale(40%);';

        let btnText = '📍 查看鄰近販售郵局';
        let btnStyle = '';
        
        if (!hasStock) {
          if (p.totalInvQty === 0) {
            btnText = '已售罄 🪧';
            btnStyle = 'disabled style="background:#5c5c5c !important; border-color:#383838 !important; color:#a3a3a3 !important; cursor:not-allowed; box-shadow:none; transform:none;"';
          } else {
            btnText = '補貨中...';
            btnStyle = 'disabled style="background:#8c7562 !important; border-color:#4a3219 !important; color:#dcdcdc !important; cursor:not-allowed; box-shadow:none; transform:none;"';
          }
        }

        // ★ 終極安全防線：用 encodeURIComponent 把文字徹底轉碼，絕對不會弄破 HTML 結構
        const safeName = encodeURIComponent(p.name || "未命名商品");
        const safeDesc = encodeURIComponent(p.desc || "目前尚未提供商品詳細說明，款式與規格請依現場實物為主。");

        const card = document.createElement('div');
        card.className = 'p-card sd-ui-box';
        card.style = outOfStockStyle;
        
        // ★ 修正 4：把轉碼過的安全字串傳遞給 openGallery
        card.innerHTML = `
          ${badgeHtml}
          <div class="p-img-box" onclick="openGallery('${p.barcode}', '${safeName}', '${safeDesc}', this.querySelector('img').src)">
            <img src="./images/${p.barcode}.jpg" alt="${p.name}" onerror="handleImageError(this, '${p.img}')">
          </div>
          <div class="p-info">
            <h3 class="p-title">${p.name}</h3>
            <div class="p-desc">${p.desc}</div>
            <div class="p-meta">
              <span class="p-barcode">條碼: ${p.barcode}</span>
              <span class="p-price">${p.price}</span>
            </div>
          </div>
          <button class="btn-view-branch" onclick="openBranchModal('${p.key}', '${p.name}')" ${btnStyle}>
            ${btnText}
          </button>
        `;
        container.appendChild(card);
      });
    }

    function localFilterProducts() {
      const searchText = document.getElementById('localSearchInput').value.toLowerCase();
      
      const filteredResults = globalData.products.filter(p => {
        const titleMatch = p.name.toLowerCase().includes(searchText);
        const barcodeMatch = String(p.barcode).toLowerCase().includes(searchText);
        return titleMatch || barcodeMatch;
      });

      renderProducts(filteredResults);
    }

    let currentGalleryImgs = [];
    let currentGalleryIdx = 0;

    // ★ 修正 5：在燈箱展開時，使用 decodeURIComponent 把文字解碼還原回來
    function openGallery(barcode, encName, encDesc, activeImgSrc) {
      currentGalleryImgs = [activeImgSrc]; 
      currentGalleryIdx = 0;
      
      document.getElementById('galleryTitle').innerText = decodeURIComponent(encName);
      document.getElementById('galleryDesc').innerText = decodeURIComponent(encDesc); 
      document.getElementById('galleryImg').src = activeImgSrc;
      document.getElementById('galleryLightbox').style.display = 'flex';
      
      updateGalleryArrows();
      checkExtraImages(barcode, 1);
    }

    function checkExtraImages(barcode, fileIndex) {
      let testImg = new Image();
      testImg.onload = function() {
        currentGalleryImgs.push(this.src);
        updateGalleryArrows();
        checkExtraImages(barcode, fileIndex + 1);
      };
      testImg.onerror = function() {
        // 偵測結束
      };
      testImg.src = `./images/${barcode}-${fileIndex}.jpg`;
    }

    function updateGalleryArrows() {
      const total = currentGalleryImgs.length;
      document.getElementById('btnPrevImg').style.display = currentGalleryIdx > 0 ? 'flex' : 'none';
      document.getElementById('btnNextImg').style.display = currentGalleryIdx < total - 1 ? 'flex' : 'none';
      
      if (total > 1) {
        document.getElementById('galleryCounter').innerText = `${currentGalleryIdx + 1} / ${total}`;
        document.getElementById('galleryCounter').style.display = 'block';
      } else {
        document.getElementById('galleryCounter').style.display = 'none';
      }
    }

    function changeGalleryImage(step) {
      currentGalleryIdx += step;
      if (currentGalleryIdx < 0) currentGalleryIdx = 0;
      if (currentGalleryIdx >= currentGalleryImgs.length) currentGalleryIdx = currentGalleryImgs.length - 1;
      
      document.getElementById('galleryImg').src = currentGalleryImgs[currentGalleryIdx];
      updateGalleryArrows();
    }

    function closeGallery() {
      document.getElementById('galleryLightbox').style.display = 'none';
      currentGalleryImgs = [];
    }

    document.addEventListener('keydown', function(event) {
      if (document.getElementById('galleryLightbox').style.display === 'flex') {
        if (event.key === 'ArrowLeft') changeGalleryImage(-1);
        if (event.key === 'ArrowRight') changeGalleryImage(1);
        if (event.key === 'Escape') closeGallery();
      }
      if (document.getElementById('branchModal').style.display === 'flex') {
        if (event.key === 'Escape') closeBranchModal();
      }
    });

    function openBranchModal(productKey, productName) {
      fetch(GAS_API_URL + '?action=recordClick&productId=' + encodeURIComponent(productKey))
        .catch(e => console.log('人氣紀錄錯誤:', e));

      document.getElementById('modalProductName').innerText = `尋找「${productName}」`;
      const listUl = document.getElementById('modalBranchList');
      const branches = getTop5Branches(productKey);
      
      listUl.innerHTML = '';
      if(branches.length === 0) {
        listUl.innerHTML = '<li class="branch-item" style="text-align:center;color:var(--sd-text-muted);padding:40px;font-weight:bold;">目前此區域尚未查詢到庫存 🍂</li>';
      } else {
        branches.forEach((b, index) => {
          const qtyClass = b.qty <= 5 ? 'b-qty low-stock' : 'b-qty';
          const qtyLabel = b.qty <= 5 ? `即將完售 (${b.qty})` : `架上剩餘: ${b.qty}`;

          let highlightClass = index === 0 ? ' highlight' : '';
          let rankIcon = '🛖 ';

          listUl.innerHTML += `
            <li class="branch-item${highlightClass}">
              <div class="b-header">
                <div class="b-name-wrapper">
                  <span class="b-name">${rankIcon}${b.name}</span>
                </div>
                <span class="${qtyClass}">${qtyLabel}</span>
              </div>
              <div class="b-detail">
                <span>📍 ${b.address}</span>
              </div>
              <div class="b-detail">
                <span>📞 ${b.phone}</span>
              </div>
            </li>
          `;
        });
      }

      document.getElementById('branchModal').style.display = 'flex';
      document.body.style.overflow = 'hidden'; 
    }

    function closeBranchModal() {
      document.getElementById('branchModal').style.display = 'none';
      document.body.style.overflow = 'auto'; 
    }

    window.onscroll = function() {
      const btn = document.getElementById('scrollToTopBtn');
      if (document.body.scrollTop > 400 || document.documentElement.scrollTop > 400) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    };

    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
